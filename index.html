<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="levia: diagnóstico completo e plano de treino, nutrição e saúde até a sua prova — corrida, triathlon, duathlon, HYROX, ciclismo, natação, raquete ou emagrecimento.">
<meta name="theme-color" content="#00875A">
<meta property="og:title" content="levia.">
<meta property="og:description" content="Da inscrição à linha de chegada: diagnóstico e plano de treino personalizado.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300875A'/%3E%3Ctext x='15' y='47' font-family='Georgia,serif' font-size='40' font-weight='700' fill='%23F9F7F2'%3El%3C/text%3E%3Ccircle cx='44' cy='42' r='6' fill='%23FF5A36'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>levia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — diagnóstico em etapas e depois app com 6 abas; navegação inferior no celular.
   Marca levia: verde profundo + areia sobre creme. Modalidades: corrida amarelo, bike violeta, natação ciano, força verde, raquete saibro. */
:root{
  --green:#00875A; --sand:#CFE6DA; --yellow:#FF5A36; --violet:#3D6BFF; --cyan:#00B8D9; --cream:#F6F8F6;
  --bg:#F6F8F6; --surface:#FFFFFF; --surface-2:#EDF2EE; --ink:#0D1F18; --muted:#55635B; --line:#DFE6E1;
  --brand:#00875A; --on-brand:#FFFFFF; --brandline:#00875A;
  --run:#FF5A36; --run-soft:#FFE7E0; --run-ink:#C73A1B;
  --bike:#3D6BFF; --bike-soft:#E4EBFF; --bike-ink:#2A4FD6;
  --swim:#00B8D9; --swim-soft:#DCF5FA; --swim-ink:#007E96;
  --gym:#00875A; --gym-soft:#DDF3E9; --gym-ink:#00754E;
  --court:#FFB020; --court-soft:#FFF1D6; --court-ink:#A06400;
  --rest:#7A8780; --rest-soft:#EDF1EE; --ok:#00875A; --ok-soft:#DDF3E9; --warn:#D98A00; --bad:#E0402A;
  --bib:#FFFFFF; --bib-ink:#0D1F18; --bib-muted:#5F6E66;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --wordmark:"Fraunces",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1410; --surface:#121E19; --surface-2:#1A2A23; --ink:#EEF4F0; --muted:#9DABA3; --line:#253730;
  --brand:#00B377; --on-brand:#FFFFFF; --brandline:#3DDC9E;
  --run:#FF6A48; --run-soft:#3A1E17; --run-ink:#FF8A6E;
  --bike:#6688FF; --bike-soft:#1B2547; --bike-ink:#8FA7FF;
  --swim:#22CCEB; --swim-soft:#0C2F37; --swim-ink:#6BE0F5;
  --gym:#3DDC9E; --gym-soft:#123226; --gym-ink:#5BE6AE;
  --court:#FFBE45; --court-soft:#33270F; --court-ink:#FFD07A;
  --rest:#8C998F; --rest-soft:#1F2C26; --ok:#3DDC9E; --ok-soft:#123226; --warn:#FFB43C; --bad:#FF6A55;
  --bib:#F6F8F6; --bib-ink:#0D1F18; --bib-muted:#5F6E66; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1410; --surface:#121E19; --surface-2:#1A2A23; --ink:#EEF4F0; --muted:#9DABA3; --line:#253730;
  --brand:#00B377; --on-brand:#FFFFFF; --brandline:#3DDC9E;
  --run:#FF6A48; --run-soft:#3A1E17; --run-ink:#FF8A6E;
  --bike:#6688FF; --bike-soft:#1B2547; --bike-ink:#8FA7FF;
  --swim:#22CCEB; --swim-soft:#0C2F37; --swim-ink:#6BE0F5;
  --gym:#3DDC9E; --gym-soft:#123226; --gym-ink:#5BE6AE;
  --court:#FFBE45; --court-soft:#33270F; --court-ink:#FFD07A;
  --rest:#8C998F; --rest-soft:#1F2C26; --ok:#3DDC9E; --ok-soft:#123226; --warn:#FFB43C; --bad:#FF6A55;
  --bib:#F6F8F6; --bib-ink:#0D1F18; --bib-muted:#5F6E66; color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--bike);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(46px,8.5vw,84px);font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:.92}
h2{font-size:30px;font-weight:700}
h3{font-size:21px;font-weight:700}
h4{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--bike)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.brand b{font-family:var(--wordmark);font-size:30px;font-weight:600;letter-spacing:-.03em;color:var(--brandline);line-height:1}
.brand b i{font-style:normal;color:var(--brandline)}
.brand span{font-size:12px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rest);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.error i{background:var(--bad)}
.tabs{display:flex;gap:4px;width:100%;overflow-x:auto}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:7px}
.tabs a svg{width:17px;height:17px}
.tabs a.on{background:var(--brand);color:var(--on-brand)}
.tabs a:hover:not(.on){background:var(--surface-2)}

main{max-width:1000px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.stat .v small{font-size:18px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .s{font-size:13px;color:var(--muted);margin-top:4px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{max-width:62ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover:not(:disabled){opacity:.9;background:var(--brand)}
.btn.go{background:var(--yellow);border-color:var(--yellow);color:#fff;box-shadow:0 8px 22px -10px rgba(255,90,54,.7);font-size:16px;padding:13px 24px;border-radius:12px}
.btn.go:hover:not(:disabled){opacity:.92;background:var(--yellow)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{width:38px;height:38px;padding:0;display:inline-grid;place-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lb{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

/* ---------- Wizard ---------- */
.wiz{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wiz-top{display:flex;flex-direction:column;gap:10px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--surface-2)}
.steps i.on{background:var(--run)}
.steps i.done{background:var(--brandline)}
.wiz h2{font-size:clamp(30px,5vw,40px)}
.q{display:flex;flex-direction:column;gap:10px}
.q > .qt{font-weight:700;font-size:16px}
.q > .qh{font-size:13px;color:var(--muted);margin-top:-6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--brandline);box-shadow:0 0 0 1px var(--brandline);background:color-mix(in srgb,var(--brandline) 6%,var(--surface))}
.opt .oi{flex:0 0 36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2)}
.opt .oi svg{width:20px;height:20px}
.opt b{display:block;font-size:15px;line-height:1.25}
.opt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.pill.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.yn{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.yn:first-child{border-top:0}
.yn p{flex:1;min-width:0}
.yn .seg{flex:0 0 auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.yes{background:var(--bad);color:#fff}
.wiz-nav{display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input{flex:1;accent-color:var(--ink)}
.range-row b{font-family:var(--display);font-size:26px;min-width:64px;text-align:right}

/* Landing */
.land{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:20px}
.land p.lead{font-size:18px;color:var(--muted);max-width:44ch;margin-top:14px}
.land ul{list-style:none;padding:0;margin:22px 0 26px;display:flex;flex-direction:column;gap:10px}
.land li{display:flex;gap:10px;align-items:flex-start}
.land li b{flex:0 0 26px;height:26px;border-radius:7px;background:var(--yellow);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:16px}
.sports{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}

/* Bib */
.bib{position:relative;background:var(--bib);color:var(--bib-ink);border-radius:12px;padding:20px 24px 18px;border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px -18px rgba(15,26,42,.45);overflow:hidden}
.bib::before,.bib::after,.bib .h1,.bib .h2{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bib::before{top:10px;left:10px}.bib::after{top:10px;right:10px}.bib .h1{bottom:10px;left:10px}.bib .h2{bottom:10px;right:10px}
.bib-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:0 10px}
.bib-top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bib-top .tag{background:var(--yellow);color:#fff;padding:2px 8px;border-radius:4px;flex:0 0 auto}
.bib-num{font-family:var(--display);font-weight:800;font-size:clamp(80px,17vw,140px);line-height:.9;text-align:center;letter-spacing:-.01em;margin:12px 0 2px}
.bib-sub{text-align:center;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bib-muted)}
.bib-strip{display:flex;margin-top:16px;border-radius:6px;overflow:hidden;height:30px;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;letter-spacing:.04em}
.bib-strip div{display:grid;place-items:center;min-width:0;white-space:nowrap;overflow:hidden;padding:0 4px}
.c-run{background:#FF5A36;color:#fff} .c-bike{background:#3D6BFF;color:#fff} .c-swim{background:#00B8D9;color:#fff} .c-t{background:#7B857F;color:#fff} .c-court{background:#FFB020;color:#3A2600} .c-gym{background:#00875A;color:#fff}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.today{display:flex;flex-direction:column;gap:12px}

/* Sessions */
.session{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--surface)}
.session .ic{flex:0 0 42px;height:42px;border-radius:10px;display:grid;place-items:center}
.session .ic svg{width:22px;height:22px}
.session .bd{flex:1;min-width:0}
.session .tt{font-weight:700;font-size:16px;line-height:1.3}
.session .ds{font-size:14px;color:var(--muted);margin-top:3px}
.session .mt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.t-run .ic,.t-run .chip.k{background:var(--run-soft);color:var(--run-ink)}
.t-bike .ic,.t-bike .chip.k{background:var(--bike-soft);color:var(--bike-ink)}
.t-swim .ic,.t-swim .chip.k{background:var(--swim-soft);color:var(--swim-ink)}
.t-brick .ic{background:linear-gradient(135deg,var(--bike-soft) 50%,var(--run-soft) 50%);color:var(--ink)} .t-brick .chip.k{background:var(--bike-soft);color:var(--bike-ink)}
.t-gym .ic,.t-gym .chip.k{background:var(--gym-soft);color:var(--gym-ink)}
.t-court .ic,.t-court .chip.k{background:var(--court-soft);color:var(--court-ink)}
.t-rest .ic,.t-mob .ic,.t-walk .ic{background:var(--rest-soft);color:var(--rest)}
.t-race .ic{background:var(--yellow);color:#fff}
.check{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check svg{width:18px;height:18px}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.sq{border-radius:9px;width:30px;height:30px}
.session.done{opacity:.7}
.session.done .tt{text-decoration:line-through;text-decoration-thickness:1.5px}
.session.is-today{border-color:var(--brandline);box-shadow:0 0 0 1px var(--brandline)}
.session.compact{padding:10px 14px;align-items:center}
.session.compact .ic{flex-basis:34px;height:34px}
.session.compact .ic svg{width:18px;height:18px}
.alt{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);font-size:14px}
.alt b{color:var(--ok)}
.dayname{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:44px;flex:0 0 44px;padding-top:2px}
.dayname b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0;line-height:1}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .3s}
.readiness{display:flex;gap:8px;flex-wrap:wrap}
.rd{flex:1 1 90px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;justify-content:center}
.rd i{width:12px;height:12px;border-radius:50%}
.rd.on{border-color:var(--brandline);box-shadow:0 0 0 1px var(--brandline)}

/* Training */
.phases{display:flex;gap:3px;overflow-x:auto;padding-bottom:8px}
.phases button{flex:1 0 22px;height:34px;border:0;border-radius:5px;position:relative;padding:0;font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-base{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.ph-build{background:color-mix(in srgb,var(--bike) 22%,var(--surface))}
.ph-spec{background:color-mix(in srgb,var(--gym) 25%,var(--surface))}
.ph-taper{background:color-mix(in srgb,var(--warn) 28%,var(--surface))}
.ph-rec{background:var(--rest-soft)}
.phases button.sel{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.phases button.now::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--run)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wk-nav{display:flex;align-items:center;gap:10px}
.wk-title{flex:1;min-width:0}
.wk-list{display:flex;flex-direction:column;gap:8px}
.wk-day{display:flex;gap:12px;align-items:flex-start}
.wk-day .session{flex:1;min-width:0}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.zone{border-radius:10px;padding:12px;background:var(--surface-2)}
.zone b{font-family:var(--display);font-size:19px;display:block}
.zone.z2{background:var(--ok-soft)} .zone.zp{background:color-mix(in srgb,var(--warn) 18%,var(--surface))} .zone.zf{background:var(--run-soft)}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.clean li{display:flex;gap:10px}
ul.clean li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--run);margin-top:8px}

/* Diagnosis */
.dx-hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:center}
.gauge{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;position:relative}
.gauge-in{width:154px;height:154px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}

function defaultState(){ return {profile:null, planStart:null, weights:[], done:{}, gear:{}, days:{}, exams:[], examReq:{}, checkin:{}, race:{}, ai:null, mealPlan:null, avatar:null, updatedAt:0}; }
function normalize(s){
  try{ s = s && typeof s==='object' ? JSON.parse(JSON.stringify(s)) : s; }catch(e){}
  const d = defaultState();
  if(!s || typeof s!=='object') return d;
  const o = Object.assign(d, s);
  ['done','gear','days','examReq','checkin','race'].forEach(k=>{ if(!o[k]||typeof o[k]!=='object') o[k]={}; });
  ['weights','exams'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  return o;
}

let dbRef=null, writing=false, pending=false, saveTimer=null;
function setSync(mode){
  const el=document.getElementById('sync'); el.className='sync '+mode;
  el.querySelector('span').textContent = mode==='cloud'?(typeof accountEmail==='string'&&accountEmail?'Salvo em '+accountEmail:'Salvo na sua conta'):mode==='error'?'Erro ao salvar':'Salvo neste aparelho';
}
function persist(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
function commit(){ persist(); render(); }
async function flush(){
  if(!dbRef) return;
  if(writing){ pending=true; return; }
  writing=true;
  try{ await dbRef.set(JSON.parse(JSON.stringify(state))); setSync('cloud'); }catch(e){ setSync('error'); }
  writing=false; if(pending){ pending=false; flush(); }
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
let sampleFn = null;
async function initRuntime(){
  if(!window.claude || typeof window.claude.use!=='function'){ setSync('local'); return; }
  claude.use('sample').then(async sm=>{ sampleFn=sm; if(!sm) return; try{ const l=await sm.limits(); sampleLimits=l; sampleOk=!!(l&&l.images); }catch(e){ sampleOk=false; } if(route==='corpo'||route==='nutricao') render(); }).catch(()=>{});
  try{
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db||!user){ setSync('local'); return; }
    const id = await user.id(); if(!id){ setSync('local'); return; }
    userCol = db.collection('data/users/'+id); photosLoaded=false;
    try{ const me=await user.me(); accountEmail = me && me.email || null; }catch(e){}
    const ref = userCol.doc('app');
    const snap = await withTimeout(ref.get(),10000);
    dbRef = ref;
    if(snap.exists){
      const remote = normalize(JSON.parse(JSON.stringify(snap.data())));
      if(remote.updatedAt >= state.updatedAt){ state=remote; try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){} render(); }
      else flush();
    } else if(state.updatedAt>0) flush();
    setSync('cloud');
  }catch(e){ setSync('local'); }
}

const DAY=864e5;
const strip=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=s=>{const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);};
const fmt=(d,o)=>d.toLocaleDateString('pt-BR',o||{day:'2-digit',month:'short'}).replace('.','');
const TODAY=strip(new Date());
const nf=(n,dg=1)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:dg,maximumFractionDigits:dg});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r5=v=>Math.max(5,Math.round(v/5)*5);
const mmss=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const fmtT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.round(s%60);return h?`${h}h${String(m).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;};
function nextMonday(d){ const g=d.getDay(); return g===1? d : addDays(d, (8-g)%7 || 7); }

function evInfo(P){ const e=EVENTS[P.evento.tipo]; return {e, d:e?e.dists[P.evento.dist]:null}; }
function bmiOf(kg,cm){ if(!kg||!cm) return null; const m=cm/100; return kg/(m*m); }
const BMI_CLASSES=[[0,18.5,'Abaixo do peso','var(--bike)'],[18.5,25,'Peso normal','var(--ok)'],[25,30,'Sobrepeso','#C9A400'],[30,35,'Obesidade I','#E08A1E'],[35,40,'Obesidade II','var(--run)'],[40,99,'Obesidade III','var(--bad)']];
const bmiClass=v=>BMI_CLASSES.find(c=>v>=c[0]&&v<c[1]);

function diagnose(P, planStart){
  const {e,d} = evInfo(P);
  const disc = e.disc;
  const caps = disc.map(k=>+(P.nivel.cap[k]??0));
  let L = Math.round(caps.reduce((a,b)=>a+b,0)/caps.length);
  const flags=[], adjust=[];
  const prat = P.nivel.praticas||{}, pk = Object.keys(prat);
  const freq = (P.nivel.nada || pk.length) ? freqFromPrat(P) : (P.nivel.freq??0);
  if(freq===0) L=Math.min(L,1);
  const bmi = bmiOf(P.peso,P.altura);
  const breakLong = P.nivel.historico==='parado2';
  const impactInj = P.saude.lesoes.some(x=>['Joelho','Tornozelo','Canela','Quadril','Pé/fascite','Lombar'].includes(x));
  const highBmi = bmi && bmi>=30;
  const parqYes = P.saude.parq.some(x=>x===true);
  // semanas
  let W, dateEv=null;
  const start = fromIso(planStart);
  if(P.evento.tipo==='saude' || P.evento.semData){ W = P.evento.tipo==='saude'?12:16; }
  else { dateEv = fromIso(P.evento.data); W = Math.max(2, Math.ceil((dateEv - start + DAY)/ (7*DAY))); }
  const needW = d.minW[L]||0;
  const ratio = needW? W/needW : 2;
  let viab = 'ok';
  if(needW && ratio<1) viab = ratio>=0.75? 'apertado' : 'curto';
  // pontuação de prontidão
  const pil = [];
  pil.push(['Condicionamento', Math.round(L/4*100)]);
  const sono=+P.vida.sono; pil.push(['Sono', sono>=7.5?100:sono>=7?85:sono>=6?60:30]);
  pil.push(['Estresse', Math.round((5-P.vida.estresse)/4*100)]);
  pil.push(['Composição', !bmi?60: bmi<18.5?60: bmi<25?100: bmi<30?70: bmi<35?45: bmi<40?25:10]);
  pil.push(['Articulações', P.saude.lesoes.length===0?100: P.saude.lesoes.length===1?60:30]);
  pil.push(['Prazo', !needW?100: ratio>=1?100: ratio>=0.75?60:25]);
  const si=strengthIndex(P); pil.push(['Força', si==null?50:Math.round(si*100)]);
  const weights=[20,15,10,15,10,15,15];
  let score = Math.round(pil.reduce((a,p,i)=>a+p[1]*weights[i],0)/100);
  if(parqYes) score=Math.min(score,60);
  // bandeiras
  if(parqYes) flags.push(['bad','Procure liberação médica antes de começar','Você respondeu "sim" em pelo menos uma pergunta de saúde. Leve este diagnóstico ao médico e peça uma avaliação (de preferência com teste ergométrico). Até lá, faça só as sessões leves.']);
  if(P.saude.gestante) flags.push(['bad','Gestação','Exercício na gestação é ótimo, mas precisa de liberação e acompanhamento do obstetra. Use este plano só com o aval dele.']);
  if(viab==='curto') flags.push(['bad','Prazo muito curto para essa prova', `Para o seu nível, o recomendado são ${needW} semanas e você tem ${W}. O plano foca em completar com segurança. Se possível, escolha uma prova menor ou uma data mais à frente.`]);
  else if(viab==='apertado') flags.push(['warn','Prazo apertado', `O ideal seriam ${needW} semanas e você tem ${W}. Dá, mas a meta é completar bem, sem buscar tempo.`]);
  if((P.evento.dist==='ironman'||P.evento.dist==='703'||P.evento.dist==='42k') && L<=1) flags.push(['bad','Distância longa para o momento atual','Recomendamos fazer antes uma prova menor (5 km, 10 km ou triathlon sprint) e construir a base por 1 ano.']);
  if(disc.includes('swim') && !P.rotina.equip.includes('piscina')) flags.push(['warn','Sem piscina','Você vai precisar de acesso a piscina ou águas abertas seguras para os treinos de natação.']);
  if(disc.includes('swim') && +(P.nivel.cap.swim??0)===0) flags.push(['warn','Aprenda o crawl primeiro','Faça aulas de natação 2x por semana no primeiro mês. O plano começa com técnica.']);
  if(disc.includes('bike') && !P.rotina.equip.includes('bike')) flags.push(['warn','Sem bike própria', P.rotina.equip.includes('academia')||P.rotina.equip.includes('rolo')?'Comece na bike ergométrica ou no rolo. Compre ou alugue uma bike até a metade do plano para treinar na rua.':'Você vai precisar de uma bike (ou academia com bike ergométrica) para os treinos.']);
  if(P.rotina.dias.length<2) flags.push(['warn','Poucos dias disponíveis','Com menos de 2 dias por semana a evolução fica lenta. Tente liberar mais um dia.']);
  // ajustes automáticos
  if(breakLong) adjust.push('Você está voltando depois de mais de 2 anos parado: o plano começa 2 degraus abaixo e progride mais devagar. O fôlego volta rápido, mas tendões e articulações levam meses.');
  if(highBmi) adjust.push('Com IMC acima de 30, limitamos as corridas a 3 por semana e usamos bike ou elíptico como treino extra, para reduzir o impacto nas articulações.');
  if(impactInj) adjust.push(`Por causa de ${P.saude.lesoes.filter(x=>x!=='Ombro'&&x!=='Cotovelo/punho').join(', ').toLowerCase()}, priorizamos treinos sem impacto e incluímos fortalecimento específico. Se a dor aumentar durante o treino, pare.`);
  if(P.saude.glp1) adjust.push('Como você usa remédio para emagrecer (tipo Mounjaro/Ozempic), a nutrição prioriza proteína e hidratação, e você nunca deve treinar em jejum longo.');
  if(sono<6.5) adjust.push('Seu sono está curto. Dormir 7 horas ou mais vai render mais do que qualquer treino extra.');
  if(P.vida.estresse>=4) adjust.push('Com estresse alto, use o check-in diário: em dia ruim, troque o treino forte por um leve.');
  if(pk.length) adjust.push(`Você já pratica ${pk.map(k=>`${(PR[k]?PR[k][1]:k).toLowerCase()} (${prat[k]>=6?'6+':prat[k]}×/sem)`).join(', ')}. Isso entra no cálculo do seu nível e o plano parte daí.`);
  if(P.rotina.fixos.length){
    adjust.push(`Seus treinos fixos (${WEEK_ORDER.filter(x=>P.rotina.fixos.includes(x)).map(x=>DOW[x]+': '+(PR[fixoTipo(P,x)]||PR.musc)[1].toLowerCase()).join(', ')}) foram mantidos e o plano se encaixa em volta deles.`);
  }
  const impactN = P.rotina.fixos.filter(x=>['futebol','basquete','tenis','beach','padel','volei','corrida','hyrox','funcional'].includes(fixoTipo(P,x))).length;
  if(impactN>=2 && disc.includes('run')) adjust.push('Você já tem bastante impacto na semana com os treinos fixos. Se as pernas pesarem, troque a corrida leve por bike.');
  if(viab!=='ok') adjust.push('Por causa do prazo, a fase de base ficou mais curta e a meta virou completar a prova bem.');
  if(si!=null) adjust.push(`Seu teste de força deu nível ${siLabel(si).toLowerCase()} (${Math.round(si*100)}/100). As cargas de cada exercício saem daí e do seu peso; refaça o teste a cada 4 semanas para elas subirem com você.`);
  if(P.rotina.local) adjust.push('Treinos de força montados para '+({maquinas:'academia com máquinas',livres:'academia com pesos livres',casa_eq:'casa com halteres e elástico',casa:'casa só com o peso do corpo'}[P.rotina.local])+'.');
  // nutrição
  const h=P.altura/100, kg=+P.peso, age=+P.idade;
  const sexK = P.sexo==='m'?5:P.sexo==='f'?-161:-78;
  const bmr = 10*kg + 6.25*P.altura - 5*age + sexK;
  const actF = 1.35 + Math.min(0.35, P.rotina.dias.length*0.04 + (P.rotina.fixos.length)*0.03 + (P.rotina.minutos>=60?0.05:0));
  const tdee = bmr*actF;
  const wantsLoss = (P.pesoMeta && P.pesoMeta<kg-1) || P.evento.dist==='emagrecer' || (bmi && bmi>=27);
  const kcal = wantsLoss ? Math.max(tdee-450, bmr*1.1, P.sexo==='f'?1400:1600) : tdee;
  const refW = bmi && bmi>27.5 ? 27.5*h*h : kg;
  const protein = Math.round(refW*1.6/5)*5;
  const water = Math.round(kg*35/250); // copos
  const fcmax = Math.round(208-0.7*age);
  return {L, Leff: Math.max(0, L-(breakLong?1:0)), W, needW, viab, ratio, score, pillars:pil, flags, adjust, bmi, dateEv,
    impact: highBmi||impactInj, breakLong, parqYes, bmr, tdee, kcal, wantsLoss, protein, water, fcmax, si};
}

/* =====================================================================
   MOTOR DE PLANOS
   ===================================================================== */
const PH_N = {base:'Base', build:'Construção', spec:'Específico', taper:'Polimento'};
function skeleton(W, taper, slow){
  taper = Math.min(taper, Math.max(0, W-3));
  const R = W - taper;
  const base = Math.max(1, Math.round(R*(slow?0.45:0.33)));
  const build = Math.round(R*0.35);
  const weeks=[]; let k=0;
  for(let i=0;i<W;i++){
    let ph = i<base?'base': i<base+build?'build': i<R?'spec':'taper';
    if(R<=3 && i<R) ph = i===0?'base':'spec';
    const rec = ph!=='taper' && (i+1)%4===0 && i<R-1;
    let f;
    if(ph==='taper'){ const j=i-R, left=W-i; f = left===1?0.4: left===2?0.6:0.75; }
    else f = 0.6 + 0.4*(R>1? i/(R-1) : 1);
    if(rec) f*=0.7;
    weeks.push({i, ph, rec, f, k});
    if(!rec && ph!=='taper') k++;
  }
  return weeks;
}
const PRIORITY = {
  corrida:['long','quality','easy','strength','cross','easy','mob'],
  tri:['swim','bike','run','longbike','swimq','longrun','strength','mob'],
  du:['run','bike','long','strength','easy','bikeq','mob'],
  hyrox:['hyx','quality','long','hyx2','easy','strength','mob'],
  bike:['longbike','bikeq','bike','strength','bike','mob','cross'],
  swim:['swim','swimq','swimlong','strength','swim','mob','cross'],
  raquete:['court','cond','court2','strength','agil','mob','court3'],
  saude:['cardio','strength','cardio2','strength2','cardio3','mob','walk']
};
const LONGS = ['long','longbike','swimlong','longrun'];
const HARD = ['quality','bikeq','swimq','cond','run','court2','hyx','hyx2'];
function assignDays(P, D){
  const tipo = P.evento.tipo;
  let pr = PRIORITY[tipo].slice();
  if(P.rotina.fixos.some(d=>(PR[fixoTipo(P,d)]||PR.musc)[3])) pr = pr.filter(k=>!k.startsWith('strength'));
  const kinds = pr.slice(0, D.length);
  const free = D.slice().sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));
  const map = {};
  const dist=(a,b)=>{const x=Math.abs(WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));return Math.min(x,7-x);};
  const take = d => { free.splice(free.indexOf(d),1); };
  const placedHard = () => Object.entries(map).filter(([d,k])=>LONGS.includes(k)||HARD.includes(k)).map(([d])=>+d);
  // longões: sábado, depois domingo
  kinds.filter(k=>LONGS.includes(k)).forEach(k=>{
    const pick = [6,0].find(x=>free.includes(x)) ?? free[free.length-1];
    if(pick!=null){ map[pick]=k; take(pick); }
  });
  kinds.filter(k=>!LONGS.includes(k)).forEach(k=>{
    if(!free.length) return;
    let pick = free[0];
    if(HARD.includes(k) || k.startsWith('strength')){
      const hs = placedHard().concat(P.rotina.fixos);
      let best=-1; free.forEach(d=>{ const m = hs.length? Math.min(...hs.map(h=>dist(d,h))) : 3; if(m>best){best=m;pick=d;} });
    }
    map[pick]=k; take(pick);
  });
  return map;
}

// Escada de retorno à corrida (corre/caminha)
const LADDER=[[6,'30″','2′30'],[8,'30″','2′'],[8,'1′','2′'],[8,'1′','1′30'],[6,'1′30','2′'],[6,'2′','2′'],[5,'3′','2′'],[4,'4′','2′'],[3,'6′','2′'],[2,'10′','2′']];
function runStepStart(cap, breakLong, impact){
  let s = [0,4,12,15,17][cap] ?? 0;
  if(breakLong) s = Math.max(0, s-2);
  if(impact) s = Math.max(0, s-1);
  return s;
}
function runWalk(step){
  const [r,a,b]=LADDER[step];
  const tot = Math.round(15 + r*(parseFloat(a.replace(',','.'))/ (a.includes('″')?60:1) + parseFloat(b)/(b.includes('″')?60:1)));
  return [r,a,b,tot];
}

function genSession(kind, c){
  const {P, dx, w, ev} = c;
  const f=w.f, ph=w.ph, rec=w.rec;
  const eq = P.rotina.equip, maxM = P.rotina.minutos, longM = P.rotina.longo;
  const tipo = P.evento.tipo;
  const runCfg = ev.run||{easy:40,long:60}, bikeCfg = ev.bike||{easy:50,long:90};
  const hasBike = eq.includes('bike'), indoorBike = eq.includes('rolo')||eq.includes('academia');
  const bikeWhere = (hasBike && (ph!=='base' || !indoorBike)) ? 'na rua' : indoorBike? 'na bike ergométrica ou no rolo':'na bike';
  const step = c.runStep;
  const strip_ = s=>s;

  // ---- corrida
  const runContMin = () => clamp(r5((15 + (step-LADDER.length)*5)), 15, runCfg.easy);
  function easyRun(title='Corrida leve'){
    if(step < LADDER.length){ const [r,a,b,t]=runWalk(step); return ['run',`Corre/caminha ${r}× (${a} + ${b})`,`10 min caminhando para aquecer. ${r} vezes: ${a} de trote leve + ${b} caminhando. 5 min caminhando no final. Trote é devagar: dá para conversar.`,t]; }
    const m = Math.min(maxM, r5(runContMin()*(rec?0.75:1)*(ph==='taper'?f+0.2:1)));
    return ['run',`${title} ${m}′`,'Ritmo de conversa (Z2). Se não der para falar frases inteiras, diminua.',m];
  }
  function qualityRun(){
    if(step < LADDER.length) return easyRun();
    if(rec) return ['run','Corrida leve + 4 acelerações',`${Math.min(maxM,r5(runContMin()*0.7))} min leve + 4× 20 s mais rápido, com caminhada entre elas.`,Math.min(maxM,r5(runContMin()*0.7))+5];
    const km = (ev.seg||[]).filter(s=>s[0]==='run').reduce((a,s)=>a+s[1],0) || 5;
    if(ph==='taper') return ['run','Ritmo de prova curto','15 min leve + 4× 1 min em ritmo de prova + 5 min leve. Pernas soltas.',30];
    if(ph==='base' || c.dx.Leff<=1) return ['run','Corrida leve + 6 acelerações',`${Math.min(maxM-10,r5(runContMin()*0.8))} min leve + 6× 20 s acelerando (sem tiro), 1 min caminhando entre elas.`,Math.min(maxM,r5(runContMin()*0.8))+10];
    if(ph==='build') { const reps = clamp(2+Math.floor(w.k/3),2,4); return ['run',`Ritmo forte: ${reps}× 6′`,`Aquecimento 10 min. ${reps} vezes: 6 min em ritmo "forte confortável" (frases curtas) + 2 min trote. 10 min de desaquecimento.`,20+reps*8]; }
    if(ph==='taper') return ['run','Ritmo de prova curto','15 min leve + 4× 1 min em ritmo de prova + 5 min leve. Pernas soltas.',30];
    const t = km<=5? ['6× 400 m em ritmo de prova','2 min trote entre os tiros',45] : km<=10? ['5× 1 km em ritmo de prova','2 min trote entre os blocos',55] : km<=21.1? ['3× 3 km em ritmo de prova','3 min trote entre os blocos',70] : ['2× 5 km em ritmo de maratona','4 min trote entre os blocos',75];
    return ['run',t[0],`Aquecimento 10–15 min. ${t[0]}, com ${t[1]}. Desaquecimento 10 min.`,Math.min(t[2],maxM+15)];
  }
  function longRun(){
    if(step < LADDER.length){ const m = clamp(r5(35 + w.k*3), 35, Math.min(longM,70)); return ['walk',`Caminhada longa ${m}′ com trotes`,`Caminhada rápida e constante, com ${Math.min(8,4+w.k)} trotes de ${step>4?'1 min':'30 s'} espalhados.`,m]; }
    const peak = Math.min(runCfg.long, longM);
    const base = runContMin()*1.3;
    let m = r5(clamp(base + w.k*5, runContMin(), peak));
    if(rec) m=r5(m*0.75); if(ph==='taper') m=r5(m*f);
    return ['run',`Longão ${m}′`,`Ritmo bem leve, de conversa.${m>75?' Leve água e um carboidrato (gel, banana ou bala de goma) a partir de 60 min.':''}${c.dx.impact?' Pode caminhar 1 min a cada 10.':''}`,m];
  }

  // ---- bike
  const bikeStart = [25,30,45,60,75][+(P.nivel.cap.bike??0)]||30;
  const bikeMin = () => Math.min(maxM, r5(clamp(bikeStart + w.k*4, 25, bikeCfg.easy)*(rec?0.75:1)*(ph==='taper'?f+0.2:1)));
  const easyBike = () => ['bike',`Pedal leve ${bikeMin()}′`,`Z2 ${bikeWhere}. Cadência solta, 80–90 rpm.`,bikeMin()];
  function qualityBike(){
    const m=bikeMin();
    if(rec || ph==='base') return ['bike',`Pedal ${m}′ com cadência`,`${bikeWhere[0].toUpperCase()+bikeWhere.slice(1)}: leve, com 6× 1 min de giro alto (95–100 rpm).`,m];
    if(ph==='build'){ const r=clamp(3+Math.floor(w.k/3),3,5); return ['bike',`Pedal com ${r}× 5′ forte`,`Aquecimento 10 min, ${r}× (5 min forte + 3 min leve), resto leve. ${bikeWhere}.`,Math.max(m,15+r*8)]; }
    if(ph==='taper') return ['bike','Pedal curto com ritmo','20 min leve + 3× 2 min em ritmo de prova. Cheque pneus e freios.',35];
    return ['bike','Pedal em ritmo de prova',`Aquecimento 15 min, 3× 10 min em ritmo de prova com 4 min leve, desaquecimento. ${bikeWhere}.`,Math.max(m,70)];
  }
  function longBike(){
    const peak = Math.min(bikeCfg.long, Math.max(longM, 60));
    let m = r5(clamp(bikeStart*1.3 + w.k*8, 40, peak));
    if(rec) m=r5(m*0.75); if(ph==='taper') m=r5(m*f);
    const brick = (tipo==='tri'||tipo==='du') && (ph==='build'||ph==='spec') && !rec;
    if(brick){ const rm = clamp(r5(10 + w.k*1.5), 10, tipo==='tri'?Math.min(40,runCfg.long/2):25); return ['brick',`Tijolo: pedal ${m}′ + corrida ${rm}′`,`Pedale ${m} min (Z2 com 20 min em ritmo de prova no fim), troque rápido de tênis e corra ${rm} min leve. As pernas pesam no começo: passos curtos.${step<LADDER.length?' Pode alternar trote e caminhada.':''}`,m+rm]; }
    return ['bike',`Pedal longo ${m}′`,`Ritmo de conversa. Leve água${m>90?' e coma algo a cada 45 min (banana, barra, gel)':''}.`,m];
  }

  // ---- natação
  const swCap = +(P.nivel.cap.swim??0);
  const swRace = (ev.swim&&ev.swim.race)||1500;
  const swStart = [0,500,900,1500,2200][swCap];
  const swM = () => Math.round(clamp(swStart + w.k*100, 400, Math.max(swStart, swRace*1.1, 1200))*(rec?0.75:1)*(ph==='taper'?f+0.2:1)/100)*100;
  function swim(){
    if(swCap===0 && w.k<6) return ['swim','Aula de natação: técnica','Respiração, flutuação, batida de pernas e braçada de crawl com professor. 45 min.',45];
    const m=swM(); return ['swim',`Natação técnica ${m} m`,`200 m soltando, ${Math.round(m*0.3/50)*50} m de educativos (braçada com pausa, respiração a cada 3), resto nado contínuo leve.`,Math.round(m/40)];
  }
  function swimQ(){
    if(swCap===0 && w.k<6) return ['swim','Aula de natação: técnica','Segunda aula da semana. Foque em soltar o ar dentro da água.',45];
    const m=swM();
    if(ph==='base'||rec) return ['swim',`Natação ${m} m com séries`,`Aquecimento 200 m, ${Math.max(4,Math.round(m*0.4/50))}× 50 m com 20 s de pausa, resto contínuo.`,Math.round(m/40)];
    const set = ph==='build'? `${Math.max(6,Math.round(m*0.5/100))}× 100 m forte, 20 s de pausa` : ph==='taper'? '6× 50 m em ritmo de prova, 30 s de pausa' : `${Math.max(3,Math.round(m*0.5/200))}× 200 m em ritmo de prova, 30 s de pausa`;
    return ['swim',`Natação ${m} m: ${set.split(',')[0]}`,`Aquecimento 300 m, ${set}, soltar 200 m.${ph==='spec'&&tipo!=='swim'?'':''}`,Math.round(m/38)];
  }
  function swimLong(){
    const m = Math.round(clamp(swM()*1.25, 600, swRace*1.3)/100)*100;
    return ['swim',`Nado contínuo ${m} m`,`Ritmo constante.${ph==='spec'?' Se possível, em águas abertas seguras, com acompanhamento. Treine olhar para frente a cada 6 braçadas.':''}`,Math.round(m/35)];
  }

  // ---- raquete
  const sportN = {tenis:'tênis',beach:'beach tennis',padel:'padel'}[P.evento.dist]||'tênis';
  const lvl = +(P.nivel.cap.court??0);
  function court(){
    if(lvl<=1) return ['court','Aula ou treino técnico',`Aula de ${sportN} ou treino guiado: empunhadura, posição de base, golpes de fundo e saque. ${maxM} min.`,maxM];
    if(ph==='base'||rec) return ['court','Quadra: fundamentos e consistência','15 min de rally de aquecimento, 30 min de golpes cruzados buscando séries de 20 bolas sem errar, 15 min de saque.',Math.min(maxM,75)];
    if(ph==='build') return ['court','Quadra: saque, devolução e transição','Saque com alvo (20 por lado), devolução, aproximação à rede e voleio. Termine com 15 min de pontos.',Math.min(maxM,75)];
    if(ph==='taper') return ['court','Quadra: ritmo leve','45 min de rally e saques, sem forçar. Teste o equipamento do torneio.',45];
    return ['court','Quadra: jogo de pontos','Pontos com placar e situações de jogo (sacando 30–40, devolvendo break point). Simule a pressão do torneio.',Math.min(maxM,90)];
  }
  function court2(){
    if(lvl<=1) return ['court','Treino com bola e parceiro','Rally colaborativo: o objetivo é manter a bola em jogo. Conte quantas trocas fazem.',maxM];
    if(ph==='taper') return ['court','Set curto de treino','Um set leve. Foco em sensação, não em resultado.',50];
    return ['court',ph==='spec'?'Partida simulada (formato do torneio)':'Partida de treino','Jogue no formato do torneio. Depois, anote 1 coisa que funcionou e 1 para treinar.',Math.min(Math.max(maxM,60),120)];
  }
  function cond(){
    if(rec) return ['bike','Condicionamento leve 30′','Bike, elíptico ou caminhada rápida, leve.',30];
    if(ph==='base') return ['run',`Aeróbico ${Math.min(maxM,r5(25+w.k*3))}′`,`Bike, corrida leve ou elíptico em Z2.${c.dx.impact?' Prefira bike ou elíptico.':''}`,Math.min(maxM,r5(25+w.k*3))];
    if(ph==='build') return ['run','Intervalado 10× (30″ / 30″)','Aquecimento 10 min. 10 vezes: 30 s forte + 30 s leve (bike ou corrida). Desaquecimento 5 min.',30];
    if(ph==='taper') return ['run','Ativação curta','10 min leve + 5 sprints curtos de 5 m + alongamento.',20];
    return ['run','Condicionamento específico de quadra','6 séries de: 6 deslocamentos de 5 m (lateral, frente, trás) com 20 s de pausa. 2 min entre séries. Simula a duração dos pontos.',35];
  }
  const agil = () => ['court','Agilidade e trabalho de pés','Escada de agilidade, split-step, deslocamento lateral, sprints de 5–10 m e mudança de direção. 25–30 min.',30];

  // ---- força, mobilidade, cruzado
  function strength(n=1){
    const extra = tipo==='raquete' ? ' Inclua rotadores do ombro, antebraço/punho e core antirrotação (pallof).' : (tipo==='tri'||tipo==='swim') ? ' Inclua ombro (manguito) e costas.' : ' Inclua panturrilha, tibial e glúteo médio para proteger joelhos e canelas.';
    if(ph==='taper') return ['gym','Força leve','Metade das séries, cargas leves. Só para manter.',30];
    const t = ph==='base'? 'Força geral':'Força + potência';
    const d = ph==='base'? 'Agachamento, levantamento terra romeno, afundo, remada, flexão (pode ser no joelho) e prancha. 3× 10–12.' : ph==='build'? 'Agachamento, afundo, step-up, remada e prancha lateral com mais carga (3× 6–8) + saltos leves.' : 'Manutenção: 2× 6–8 nos exercícios principais, sem chegar à falha.';
    const lw={maquinas:'Academia com máquinas',livres:'Academia com pesos livres',casa_eq:'Em casa, com halteres e elástico',casa:'Em casa, com o peso do corpo'}[P.rotina.local];
    const sr2 = ph==='base'?'3 séries de 10–12 repetições':ph==='build'?'4 séries de 6–8, mais carga':'2 séries de 6–8, manutenção';
    return ['gym', n===2? t+' (2)': t, lw? `${lw} · ${sr2}. Exercícios, cargas e imagens no treino completo.` : d+extra, 45];
  }
  const mob = () => ['mob','Mobilidade e recuperação','20–30 min de alongamento, rolo de liberação e mobilidade de quadril, tornozelo e coluna torácica.',25];
  const cross = () => ['bike','Treino cruzado sem impacto',`${Math.min(maxM,40)} min leves de bike, elíptico ou natação.`,Math.min(maxM,40)];

  // ---- saúde
  function cardio(n){
    const cap = +(P.nivel.cap.cardio??0);
    if(c.dx.impact || cap<=1){
      const m = Math.min(maxM, r5(clamp([20,30,40,45,45][cap] + w.k*3, 20, 60)*(rec?0.75:1)));
      if(n===2) return ['bike',`Bike ou elíptico ${m}′`, ph==='base'?'Leve e constante.':'Leve, com 6× 1 min mais forte.',m];
      return ['walk',`Caminhada rápida ${m}′`,'Ritmo em que dá para conversar, mas não cantar. Some passos no dia: meta de 8 a 10 mil.',m];
    }
    if(n===2) return ['bike',`Bike ou elíptico ${Math.min(maxM,40)}′`,'Com 8× 1 min forte + 1 min leve no meio.',Math.min(maxM,40)];
    return easyRun('Corrida leve');
  }

  // ---- HYROX
  const hxL = +(P.nivel.cap.hyrox??0);
  function hyx(){
    if(ph==='taper') return ['gym','Estações leves','Técnica de todas as estações com metade da carga, sem chegar a cansar. 30 min.',30];
    if(rec) return ['gym','Estações técnicas','Wall ball, lunges e remo leves, foco em técnica. 30–40 min.',35];
    if(ph==='base') return ['gym','Força funcional + técnica das estações',`Sled push e pull (ou leg press e remada pesada), farmers carry, sandbag lunges e wall balls. 4 blocos de 8–12 repetições ou 20–30 m, descanso completo.${hxL<=1?' Use cargas leves e aprenda o movimento primeiro.':''}`,Math.min(maxM,60)];
    if(ph==='build') return ['gym','EMOM de estações','EMOM de 24 min alternando: 250 m de remo, 15 wall balls, 20 m de sled (ou 12 agachamentos com peso) e 8 burpees broad jump.',45];

  function hyx2(){

    if(rec||ph==='base') return ['bike','Remo ou SkiErg intervalado','8× (1 min forte + 1 min leve) no remo ou SkiErg + 3× 10 burpees broad jump com técnica.',35];
    if(ph==='build') return ['run','Corrida comprometida','5× (800 m + 20 wall balls ou 20 lunges), sem pausa entre a corrida e a estação; 2 min entre os blocos.',45];
    return ['run','Simulado de HYROX', w.k%2? 'Simulado completo: 8× (1 km + estação) com cargas de treino. Mesmo tênis e lanche do dia da prova.' : '6× (1 km + estação) em ritmo de prova.',75];
  }

  switch(kind){
    case 'hyx': return hyx();
    case 'hyx2': return hyx2();
    case 'long': return tipo==='du' && (ph==='build'||ph==='spec') && !rec ? longBike() : longRun();
    case 'quality': return qualityRun();
    case 'easy': return c.dx.impact && c.runCount>=3 ? cross() : easyRun();
    case 'run': return tipo==='tri'||tipo==='du' ? (ph==='base'||rec? easyRun() : qualityRun()) : easyRun();
    case 'longrun': return longRun();
    case 'bike': return easyBike();
    case 'bikeq': return qualityBike();
    case 'longbike': return longBike();
    case 'swim': return swim();
    case 'swimq': return swimQ();
    case 'swimlong': return swimLong();
    case 'court': return court();
    case 'court2': return court2();
    case 'court3': return court();
    case 'cond': return cond();
    case 'agil': return agil();
    case 'strength': return strength(1);
    case 'strength2': return strength(2);
    case 'mob': return mob();
    case 'cross': return cross();
    case 'cardio': return cardio(1);
    case 'cardio2': return cardio(2);
    case 'cardio3': return cardio(1);
    case 'walk': return ['walk','Caminhada leve 30′','Passeio, de preferência ao ar livre.',30];
  }
  return mob();
}

// índice de força 0..1 a partir do teste (flexões, agachamentos em 1 min, prancha)
function strengthIndex(P){
  const F=P.forca||{}; if(F.flex==null && F.agach==null && F.prancha==null) return null;
  const pts=(v,arr)=>{ v=+v||0; for(let i=arr.length-1;i>=0;i--) if(v>=arr[i][0]){ const [x0,y0]=arr[i], [x1,y1]=arr[i+1]||arr[i]; return x1===x0? y0 : y0+(y1-y0)*Math.min(1,(v-x0)/(x1-x0)); } return 0; };
  const fem=P.sexo==='f';
  let push=pts(F.flex, fem? [[0,0],[5,.4],[12,.65],[20,.9],[30,1]] : [[0,0],[10,.4],[20,.65],[30,.9],[45,1]]);
  if(F.joelho) push*=.55;
  const sq=pts(F.agach,[[0,0],[20,.35],[35,.6],[50,.9],[60,1]]);
  const pl=pts(F.prancha,[[0,0],[30,.4],[60,.65],[120,.9],[180,1]]);
  return Math.round(((push+sq+pl)/3)*100)/100;
}
const siLabel = si => si==null? '—' : si<.3? 'Iniciante' : si<.55? 'Básico' : si<.75? 'Intermediário' : 'Avançado';
function loadFn(P,dx){
  const h=P.altura/100, bw=Math.min(+P.peso||70, 27.5*h*h);
  const si=dx.si; const sexF={f:.7,m:1,x:.85}[P.sexo]||.85;
  const m=(si!=null? .55+.9*si : LV_MULT[dx.Leff])*sexF;
  return (ratio,kind,phF,rm10)=>{ let kg = rm10? rm10*phF : bw*ratio*m*phF;
    if(kind==='bar'){ kg=Math.max(20,Math.round(kg/5)*5); return kg+' kg (barra + anilhas)'; }
    if(kind==='mach'){ kg=Math.max(5,Math.round(kg/5)*5); return kg+' kg'; }
    kg=Math.max(2,Math.round(kg/2)*2); return kind==='db'? kg+' kg cada mão' : kg+' kg'; };
}

  const wb = pro? (f?6:9) : (f?4:6), sb = pro? (f?20:30) : (f?10:20), fc = pro? (f?24:32) : (f?16:24);
  const tr = ph==='base'? .7 : 1;
  const r2=k=>Math.max(2,Math.round(k*tr/2)*2);
  if(kind==='hyx'){
    if(ph==='build') return {blocks:[{t:'Aquecimento',m:10,rows:[['Remo leve','5 min','','',''],['Agachamento e afundo sem peso','2 × 10','','','']]},{t:'EMOM 24 min (a cada minuto)',m:24,rows:[['Minuto 1: remo','250 m','','resto do minuto',''],['Minuto 2: wall ball','15',`${wb} kg`,'resto do minuto','Alvo a 3 m (homens) / 2,7 m (mulheres).'],['Minuto 3: sled push (ou agachamento com halter)','20 m (ou 12)','sled leve / '+r2(fc)+' kg','resto do minuto',''],['Minuto 4: burpee broad jump','8','','resto do minuto','Salto à frente depois de cada burpee.'],['Repita o ciclo','6 vezes','','','']]},{t:'Volta à calma',m:5,rows:COOL}],tip:'Se não fechar dentro do minuto, diminua as repetições.'};
    if(ph==='spec') return {blocks:[{t:'Aquecimento',m:10,rows:[['Corrida leve','5 min','','',''],['Wall ball leve','10','','','']]},{t:'Meio simulado',m:45,rows:[['1 km de corrida + SkiErg','1 km + 500 m','ritmo de prova','',''],['1 km de corrida + sled push','1 km + 25 m','sled de prova (ou leg press pesado)','',''],['1 km de corrida + burpee broad jump','1 km + 40 m','','',''],['1 km de corrida + wall balls','1 km + 50',`${wb} kg`,'','Quebre em séries de 10–15.']]},{t:'Volta à calma',m:5,rows:COOL}],tip:'Anote o tempo de cada trecho para comparar no próximo simulado.'};
    return {blocks:[{t:'Aquecimento',m:10,rows:[['Remo ou bike leve','5 min','','',''],['Agachamento, afundo e flexão sem peso','2 × 10 cada','','','']]},{t:'Força + técnica das estações',m:40,rows:[['Sled push (ou leg press pesado)','4 × 20 m (ou 4 × 12)','sled leve / leg press moderado','2 min','Tronco inclinado, passos curtos.'],['Sled pull (ou remada sentada pesada)','4 × 20 m (ou 4 × 12)','moderado','2 min','Puxe com as pernas, não só com os braços.'],['Farmers carry','4 × 40 m',`${r2(fc)} kg cada mão`,'90 s','Ombros para baixo, passos rápidos.'],['Sandbag lunges','3 × 20 m',`${r2(sb)} kg`,'90 s','Joelho de trás quase encosta no chão.'],['Wall ball','4 × 15',`${r2(wb)} kg`,'60 s','Agache fundo e use as pernas para lançar.']]},{t:'Volta à calma',m:5,rows:COOL}],tip:'Cargas de treino em ~70% da prova nesta fase. Técnica primeiro.'};
  }
  // hyx2
  if(s[0]==='bike') return {blocks:[{t:'Aquecimento',m:5,rows:[['Remo ou SkiErg leve','5 min','','','']]},{t:'Intervalado',m:25,rows:[['Remo ou SkiErg forte','8 × 1 min',zones(dx.fcmax).zp,'1 min leve',''],['Burpee broad jump','3 × 10','técnica','60 s','']]},{t:'Volta à calma',m:5,rows:COOL}],tip:'Remo: pernas, depois tronco, depois braços.'};
  return {blocks:[{t:'Aquecimento',m:10,rows:WARM_RUN},{t:'Parte principal',m:s[3],rows:[[s[1],'','ritmo de prova','',s[2]],['Wall ball (quando houver)','conforme o bloco',`${wb} kg`,'','']]},{t:'Volta à calma',m:5,rows:COOL}],tip:'Corrida comprometida: o segredo é sair da estação e já encontrar o ritmo.'};
}
function detailFor(kind,s,c){
  const {P,dx,w}=c, tipo=P.evento.tipo, ph=w.ph;
  if(!s) return null;
  if(kind==='hyx'||kind==='hyx2') return hyroxDetail(kind,s,ph,P,dx);
  if(['court','court2','court3','cond','agil'].includes(kind) && tipo==='raquete') return courtDetail(kind==='court3'?'court':kind,s,ph,P);
  if(s[0]==='gym') return strengthDetail(P,dx,ph,tipo,/leve/i.test(s[1]));

}

function mondayOf(d){ return addDays(d, -((d.getDay()+6)%7)); }
function buildPlan(P, planStart, startDay){
  const firstDay = startDay? fromIso(startDay) : null;
  const dx = diagnose(P, planStart);
  const {e,d} = evInfo(P);
  const weeks = skeleton(dx.W, d.taper||0, dx.breakLong || dx.Leff<=1);
  const start = fromIso(planStart);
  const D = P.rotina.dias.filter(x=>!P.rotina.fixos.includes(x));
  const map = assignDays(P, D);
  if(!P.rotina.fixos.some(x=>(PR[fixoTipo(P,x)]||PR.musc)[3])){
    const inPlan = Object.values(map).some(k=>k.startsWith('strength'));
    dx.adjust.push(inPlan? 'Como você não tem treino de força fixo, incluímos força no plano: previne lesão e melhora o rendimento.' : 'Não coube uma sessão de força nos seus dias livres. Se puder, faça 20 min em casa 2 vezes por semana: agachamento, afundo, ponte de glúteo e prancha.');
  }
  let runStep = runStepStart(+(P.nivel.cap.run ?? P.nivel.cap.cardio ?? 0), dx.breakLong, dx.impact);
  const out = [];
  weeks.forEach(w=>{
    const days = {};
    const wkStart = addDays(start, w.i*7);
    const stepNow = w.rec? Math.max(0, runStep-2) : runStep;
    let runCount = 0;
    WEEK_ORDER.forEach(dw=>{
      const date = addDays(wkStart, WEEK_ORDER.indexOf(dw));
      if(dx.dateEv && date > dx.dateEv) return;
      if(firstDay && date < firstDay) return;
      let s=null;
      if(dx.dateEv && iso(date)===iso(dx.dateEv)){ s=['race', P.evento.nomeProva? P.evento.nomeProva : d.n, RACE_SESSION[P.evento.tipo]||'Dia da prova!', 0, raceDetail(P,d,dx)]; }
      else if(dx.dateEv && iso(addDays(date,1))===iso(dx.dateEv)){ s=['rest','Véspera: descanso','Separe tudo, jante cedo e durma cedo. 10 min de soltura opcional.',0]; }
      else if(P.rotina.fixos.includes(dw)){
        const nearRace = dx.dateEv && (dx.dateEv - date)/DAY <= 3;
        const pf = PR[fixoTipo(P,dw)]||PR.musc;
        s = nearRace? ['rest','Descanso (perto da prova)','Hoje sem o treino fixo. Caminhada leve se quiser.',0] : [pf[2],'Seu treino fixo: '+pf[1],'Mantido como você já faz. Conte ao seu professor ou treinador quais são os treinos do plano.'+ (w.ph==='taper'?' Esta semana: mais leve.':''),60, fixedDetail(pf,w.ph)];
      }
      else if(map[dw]){
        s = genSession(map[dw], {P, dx, w, ev:d, runStep:stepNow, runCount});
        s = s.slice(0,4); s[4] = detailFor(map[dw], s, {P, dx, w});
        if(s[0]==='run'||s[0]==='brick') runCount++;
      }
      if(s) days[dw]=s;
    });
    out.push({...w, start:wkStart, days});
    if(!w.rec && w.ph!=='taper') runStep = Math.min(runStep+1, 40);
  });
  return {dx, weeks:out, ev:d, fam:e};
}

function sessionCard(s, o={}){

function altFor(s){
  const t=s[0];
  if(t==='run'||t==='brick') return 'Troque por 30–40 min de bike leve, elíptico ou caminhada. Sem tiros.';
  if(t==='bike') return 'Faça só 30 min bem leves, ou troque por mobilidade.';
  if(t==='swim') return 'Nade 20–30 min soltos, só técnica.';
  if(t==='court') return 'Treino técnico leve de 30–40 min, sem jogo de pontos.';
  if(t==='gym') return 'Faça metade das séries com carga leve, ou troque por mobilidade.';
  return 'Mantenha leve.';
}

function validateStep(s,P){
  if(s===0){ if(!P.evento.tipo) return 'Escolha um objetivo.'; if(!P.evento.dist) return 'Escolha uma opção de distância ou foco.';
    if(P.evento.tipo!=='saude' && !P.evento.semData){ if(!P.evento.data) return 'Informe a data da prova ou marque que ainda não tem data.'; if(fromIso(P.evento.data) < addDays(TODAY,14)) return 'A prova precisa estar pelo menos 2 semanas à frente.'; } }
  if(s===1){ if(!P.nome.trim()) return 'Diga como podemos te chamar.'; if(!(P.idade>=14&&P.idade<=90)) return 'Informe uma idade entre 14 e 90.'; if(!(P.altura>=120&&P.altura<=230)) return 'Informe a altura em centímetros.'; if(!(P.peso>=30&&P.peso<=300)) return 'Informe o peso em kg.'; if(!P.sexo) return 'Escolha uma opção de sexo.'; }
  if(s===2){ if(P.saude.parq.some(x=>x===null)) return 'Responda todas as perguntas de saúde.'; if(P.saude.glp1===null) return 'Responda sobre o remédio para emagrecer.'; if(P.sexo==='f' && P.saude.gestante===null) return 'Responda sobre gestação.'; }
  if(s===3){ if(!P.nivel.historico) return 'Escolha sua história com exercício.'; if(!P.nivel.nada && !Object.keys(P.nivel.praticas).length) return 'Marque o que você pratica hoje, ou "Nada no momento".'; const miss=EVENTS[P.evento.tipo].disc.find(d=>P.nivel.cap[d]==null); if(miss) return 'Responda sobre seu nível em cada modalidade.'; }
  if(s===4){ if(P.rotina.dias.length<2) return 'Escolha pelo menos 2 dias.'; if(P.rotina.dias.length - P.rotina.fixos.length < 1) return 'Deixe pelo menos 1 dia livre para os treinos do plano.'; if(!P.rotina.local) return 'Escolha onde prefere fazer os treinos de força.'; if(P.forca.flex==null||P.forca.agach==null||P.forca.prancha==null) return 'Preencha o teste de força (pode colocar 0).'; }
  if(s===5){ if(!P.vida.trabalho) return 'Diga como é seu trabalho.'; if(P.vida.nutri===null) return 'Diga se tem nutricionista.'; }
  return '';
}

function calcOut(segs){
  const r=state.race; let tot=0; const parts=segs.map(s=>{ let sec;
    if(s[0]==='t') sec=r.trans*30; else if(s[0]==='run') sec=r.run*s[1]; else if(s[0]==='bike') sec=s[1]/r.bike*3600; else if(s[0]==='st') sec=r.st*60*s[1]; else sec=r.swim*s[1]*10;
    tot+=sec; return [s,sec]; });

function aiHtml(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n'); let out='', inList=false;
  lines.forEach(l=>{ const s=l.trim(); if(!s){ if(inList){out+='</ul>';inList=false;} return; }
    if(/^#+\s/.test(s)){ if(inList){out+='</ul>';inList=false;} out+=`<h4>${s.replace(/^#+\s/,'')}</h4>`; }
    else if(/^[-•*]\s/.test(s)){ if(!inList){out+='<ul>';inList=true;} out+=`<li>${s.replace(/^[-•*]\s/,'')}</li>`; }
    else { if(inList){out+='</ul>';inList=false;} out+=`<p>${s}</p>`; } });
  if(inList) out+='</ul>'; return out;
}

const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function fileToImages(file, maxPages=4){
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
    try{ await loadPdfJs(); }catch(e){ throw {stage:'pdf', code:'pdf_load'}; }
    let pdf; try{ pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false, disableFontFace:true, useWorkerFetch:false}).promise; }catch(e){ console.warn('pdf',e); throw {stage:'pdf', code:'pdf_open'}; } const out=[];
    for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1.7}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; out.push(await toBlob(c,.85)); }
    return out; }
  let img; try{ img=await createImageBitmap(file); }catch(e){ throw {stage:'img', code:'img_open'}; }
  const sc=Math.min(1,1800/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(img,0,0,c.width,c.height); return [await toBlob(c,.85)];
}
const isPdf=f=>f.type==='application/pdf' || /\.pdf$/i.test(f.name||'');
async function pdfText(file, maxPages=8){
  await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false, disableFontFace:true, useWorkerFetch:false}).promise;
  let out=''; for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); let lastY=null;
    for(const it of tc.items){ const y=it.transform? Math.round(it.transform[5]) : null; out += (lastY!==null && y!==lastY? '\n' : ' ') + it.str; lastY=y; } out+='\n\n'; }
  return out;
}
async function askJSONText(prompt){

async function readDoc(file, prompt, maxPages){
  // 1º: PDF digital → texto (não depende de enviar imagens)
  if(isPdf(file)){
    let txt=''; try{ txt=await pdfText(file, maxPages); }catch(e){ console.warn('pdf texto', e); }
    if(txt.replace(/\s/g,'').length>60) return await askJSONText(prompt+'\n\nO conteúdo vem do texto extraído do PDF abaixo (a formatação pode estar embaralhada):\n\n'+txt.slice(0,90000));

function render(){

  const hasProfile=!!state.profile;
  const inWiz = route==='diagnostico';
  tabs.hidden = !hasProfile || inWiz;
  document.body.classList.toggle('has-tabs', !tabs.hidden);
  const hd=document.getElementById('hdr-days'); hd.textContent='';
  if(hasProfile){ const dx=getPlan().dx; if(dx.dateEv){ const dr=Math.round((dx.dateEv-TODAY)/DAY); if(dr>0) hd.textContent=`faltam ${dr} dias`; } }
  if(!tabs.hidden) tabs.innerHTML=Object.entries(VIEWS).map(([k,v])=>`<a href="#${k}" class="${route===k?'on':''}" ${route===k?'aria-current="page"':''}>${ICONS[k]}<span>${v}</span></a>`).join('');
  let html;
  if(inWiz){ if(!draft){ draft=state.profile?JSON.parse(JSON.stringify(state.profile)):emptyProfile(); } fixDraft(draft); html=viewWizard(); }
  else if(!hasProfile) html=viewLanding();
  else if(route==='avatar') html=viewAvatar();
  else html=({hoje:viewHoje,treino:viewTreino,nutricao:viewNutricao,corpo:viewCorpo,prova:viewProva,perfil:viewPerfil}[route]||viewHoje)();
  const keep={}; ['w-kg','w-date','e-date'].forEach(id=>{const el=document.getElementById(id); if(el) keep[id]=el.value;});
  app.innerHTML=html;
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id); if(el&&v) el.value=v;});
  const slot=document.getElementById('stage-slot');
  if(slot){
    STAGE.mount(slot);
    STAGE.setLook(currentLook());
    if(inWiz) STAGE.set(stageFor(draft,wizStep));
    else if(hasProfile && route==='avatar') STAGE.set(stageAvatar());
    else if(hasProfile && route==='perfil') STAGE.set(stagePerfil());
    else if(hasProfile && route==='corpo') STAGE.set(stageCorpo());

  }
}

function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks.at(-1)]=val; }
function toggleArr(a,v){ const i=a.indexOf(v); if(i>-1) a.splice(i,1); else a.push(v); }
function wizRerender(){ saveDraft(); wizErr=''; const y=window.scrollY; render(); window.scrollTo(0,y); }
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-start]'); if(!t){ if(pendingDel||pendingExamDel||pendingPhotoDel||pendingMealDel){pendingDel=null;pendingExamDel=null;pendingPhotoDel=null;pendingMealDel=false;render();} return; }
  const ds=t.dataset;
  // landing / wizard
  if(ds.start){ if(!draft) draft=emptyProfile(); wizStep=0; location.hash='diagnostico'; return; }
  if(route==='diagnostico' && draft){
    const P=draft;
    if(ds.tipo){ if(P.evento.tipo!==ds.tipo){ P.evento.tipo=ds.tipo; P.evento.dist=''; P.nivel.cap={}; } return wizRerender(); }
    if(ds.dist){ P.evento.dist=ds.dist; return wizRerender(); }
    if(ds.semdata){ P.evento.semData=!P.evento.semData; return wizRerender(); }
    if(ds.meta){ P.evento.meta=ds.meta; return wizRerender(); }
    if(ds.sexo){ P.sexo=ds.sexo; return wizRerender(); }
    if(ds.yn!=null){ P.saude.parq[+ds.yn]= ds.v==='1'; return wizRerender(); }
    if(ds.glp){ P.saude.glp1= ds.glp==='1'; return wizRerender(); }
    if(ds.gest){ P.saude.gestante= ds.gest==='1'; return wizRerender(); }
    if(ds.inj){ toggleArr(P.saude.lesoes,ds.inj); return wizRerender(); }
    if(ds.hist){ P.nivel.historico=ds.hist; return wizRerender(); }
    if(ds.nada){ P.nivel.nada=!P.nivel.nada; if(P.nivel.nada) P.nivel.praticas={}; return wizRerender(); }
    if(ds.prat){ if(P.nivel.praticas[ds.prat]!=null) delete P.nivel.praticas[ds.prat]; else { P.nivel.praticas[ds.prat]=2; P.nivel.nada=false; } return wizRerender(); }
    if(ds.pratn){ P.nivel.praticas[ds.pratn]=+ds.v; return wizRerender(); }
    if(ds.cap){ P.nivel.cap[ds.cap]=+ds.v; return wizRerender(); }
    if(ds.dia!=null){ const d=+ds.dia; toggleArr(P.rotina.dias,d); if(!P.rotina.dias.includes(d)) P.rotina.fixos=P.rotina.fixos.filter(x=>x!==d); return wizRerender(); }
    if(ds.fixo!=null){ toggleArr(P.rotina.fixos,+ds.fixo); return wizRerender(); }
    if(ds.min){ P.rotina.minutos=+ds.min; return wizRerender(); }
    if(ds.longo){ P.rotina.longo=+ds.longo; return wizRerender(); }
    if(ds.equip){ toggleArr(P.rotina.equip,ds.equip); return wizRerender(); }
    if(ds.local){ P.rotina.local=ds.local; return wizRerender(); }
    if(ds.joelho){ P.forca.joelho=!P.forca.joelho; return wizRerender(); }
    if(ds.estresse){ P.vida.estresse=+ds.estresse; return wizRerender(); }
    if(ds.trab){ P.vida.trabalho=ds.trab; return wizRerender(); }
    if(ds.restr){ toggleArr(P.vida.restricoes,ds.restr); return wizRerender(); }
    if(ds.nutri){ P.vida.nutri= ds.nutri==='1'; return wizRerender(); }
    if(ds.wiz==='back'){ wizErr=''; if(wizStep===0){ location.hash= state.profile?'perfil':'hoje'; } else { wizStep--; render(); window.scrollTo(0,0); } return; }
    if(ds.wiz==='next'){ const er=validateStep(wizStep,P); if(er){ wizErr=er; document.getElementById('wiz-err').textContent=er; return; } wizErr=''; if(wizStep===6) return finishWizard(); wizStep++; saveDraft(); render(); window.scrollTo(0,0); return; }
    return;
  }
  // app
  if(ds.done){ state.done[ds.done]=!state.done[ds.done]; if(!state.done[ds.done]) delete state.done[ds.done]; return commit(); }
  if(ds.week!=null){ selWeek=+ds.week; return render(); }
  if(ds.water){ const d=iso(TODAY), l=dayLog(); const n=+ds.water; l.water=l.water===n?n-1:n; state.days[d]=l; return commit(); }
  if(ds.prot){ const d=iso(TODAY), l=dayLog(); l.protein=ds.prot==='reset'?0:Math.max(0,l.protein + +ds.prot); state.days[d]=l; return commit(); }
  if(ds.gear){ state.gear[ds.gear]=!state.gear[ds.gear]; if(!state.gear[ds.gear]) delete state.gear[ds.gear]; return commit(); }
  if(ds.ck){ const d=iso(TODAY), c=state.checkin[d]||{}; c.cor = c.cor===ds.ck? undefined : ds.ck; state.checkin[d]=c; return commit(); }
  if(ds.examreq){ state.examReq[ds.examreq]=!state.examReq[ds.examreq]; if(!state.examReq[ds.examreq]) delete state.examReq[ds.examreq]; return commit(); }
  if(ds.examsel){ selExam=ds.examsel; pendingExamDel=null; return render(); }
  if(ds.examdel){ if(pendingExamDel===ds.examdel){ state.exams=state.exams.filter(x=>x.d!==ds.examdel); pendingExamDel=null; selExam=null; return commit(); } pendingExamDel=ds.examdel; return render(); }
  if(ds.del){ if(pendingDel===ds.del){ const [d,kg]=ds.del.split('|'); const i=state.weights.findIndex(w=>w.d===d&&String(w.kg)===kg); if(i>-1) state.weights.splice(i,1); pendingDel=null; return commit(); } pendingDel=ds.del; return render(); }
  if(ds.ai){ return runAI(); }
  if(ds.avatar){ avatarView=ds.avatar; return render(); }
  if(ds.photodel){ if(pendingPhotoDel===ds.photodel){ const k=ds.photodel; pendingPhotoDel=null; savePhoto(k,null); return; } pendingPhotoDel=ds.photodel; return render(); }
  if(ds.mealdel){ if(pendingMealDel){ pendingMealDel=false; state.mealPlan=null; upMsg.meal=''; return commit(); } pendingMealDel=true; return render(); }
  if(ds.avopen){ openAvatar(ds.avopen); return; }
  if(route==='avatar' && avDraft){
    if(ds.avtab){ avTab=ds.avtab; return render(); }
    if(ds.av){ const v = ds.av==='skin'? +ds.v : ds.v; const ks=ds.av.split('.'); let o=avDraft; ks.slice(0,-1).forEach(k=>{ o[k]=o[k]||{}; o=o[k]; }); o[ks.at(-1)]=v;
      if(ds.av==='sex'){ if(v==='m' && avDraft.top.style==='top') avDraft.top.style='regata'; if(v==='f' && avDraft.beard!=='nenhuma') avDraft.beard='nenhuma'; }
      return render(); }
    if(ds.avt){ const k=ds.avt.split('.')[1]; avDraft.acc=avDraft.acc||{}; avDraft.acc[k]=!avDraft.acc[k]; if(k==='bone'&&avDraft.acc.bone){ avDraft.acc.viseira=false; avDraft.acc.faixa=false; } if((k==='viseira'||k==='faixa')&&avDraft.acc[k]) avDraft.acc.bone=false; return render(); }
    if(ds.avpose){ avPose=ds.avpose; return render(); }
    if(ds.avrand){ avDraft=randomAvatar(); return render(); }
    if(ds.avcancel){ avDraft=null; location.hash=avReturn||'perfil'; return; }
    if(ds.avsave){ state.avatar=JSON.parse(JSON.stringify(avDraft)); avDraft=null; const back=avReturn||'perfil'; avFirst=false; location.hash=back; return commit(); }
  }
  if(ds.startnow){ state.planStart=iso(mondayOf(TODAY)); state.startDay=iso(TODAY); PLAN=null; selWeek=null; return commit(); }
  if(ds.redo==='edit'){ draft=JSON.parse(JSON.stringify(state.profile)); wizStep=0; location.hash='diagnostico'; return; }
  if(ds.redo==='ask'){ confirmReset=true; return render(); }
  if(ds.redo==='cancel'){ confirmReset=false; return render(); }
  if(ds.redo==='wipe'){ state=defaultState(); PLAN=null; draft=null; confirmReset=false; try{localStorage.removeItem(LS_DRAFT)}catch(e){} location.hash='hoje'; return commit(); }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(route==='diagnostico' && draft && el.dataset.path){
    let v=el.value; if(el.dataset.num) v= v===''?null:+v;
    setPath(draft, el.dataset.path, v); saveDraft();
    if(el.id==='w-sono'){ document.getElementById('w-sono-v').textContent=nf(+v,v%1?1:0)+' h'; }
    if(el.dataset.path==='peso'||el.dataset.path==='altura'){ STAGE.setBody({cm:draft.altura||175, kg:draft.peso||(draft.altura?22.5*(draft.altura/100)**2:72), prog:0, sex:draft.sexo}); }
    return;
  }
  if(el.dataset.avr && avDraft){ const ks=el.dataset.avr.split('.'); avDraft[ks[0]]=avDraft[ks[0]]||{}; avDraft[ks[0]][ks[1]]=(+el.value)/100; STAGE.setLook(avDraft); return; }
  if(el.id==='ph-cut'){ el.closest('.ph-compare').style.setProperty('--cut', el.value+'%'); return; }
  if(el.dataset.race){
    state.race[el.dataset.race]=+el.value;
    const k=el.dataset.race, v=document.getElementById('v-'+k);
    if(v) v.textContent = k==='run'||k==='swim'? mmss(+el.value) : el.value;
    const out=document.getElementById('calc-out'); if(out) out.innerHTML=calcOut(getPlan().ev.seg||[]);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(route==='diagnostico'){ if(draft && el.dataset.fixotipo!=null){ draft.rotina.fixosTipo[el.dataset.fixotipo]=el.value; saveDraft(); } return; }
  if(el.dataset.upload){ const f=el.files&&el.files[0]; if(f) (el.dataset.upload==='exam'?readExam:readMeal)(f); return; }
  if(el.dataset.photo){ const f=el.files&&el.files[0], k=el.dataset.photo; if(f) compressPhoto(f).then(url=>savePhoto(k,{d:iso(TODAY),img:url})).catch(()=>{ upMsg.foto='Não foi possível abrir esta imagem.'; render(); }); return; }
  if(el.dataset.race){ return persist(); }
  if(el.dataset.marker){ const cur=state.exams.find(x=>x.d===selExam); if(!cur) return; const n=parseFloat(String(el.value).replace(',','.')); if(isNaN(n)) delete cur.vals[el.dataset.marker]; else cur.vals[el.dataset.marker]=n; persist();
    const m=markers(state.profile.sexo).find(x=>x[0]===el.dataset.marker), st=mStatus(m,cur.vals[el.dataset.marker]); el.closest('.mrow').children[2].innerHTML=st?`<span class="prio ${st[1]}">${st[0]}</span>`:''; return; }
  if(el.id==='ck-pct'){ const d=iso(TODAY), c=state.checkin[d]||{}; const n=parseInt(el.value,10); c.pct=isNaN(n)?undefined:clamp(n,0,100); if(c.pct!=null) c.cor=c.pct>=67?'verde':c.pct>=34?'amarelo':'vermelho'; state.checkin[d]=c; return commit(); }
  if(el.id==='p-meta'){ state.profile.pesoMeta=el.value?+el.value:null; PLAN=null; return commit(); }
  if(el.id==='p-alt'){ state.profile.altura=el.value?+el.value:state.profile.altura; PLAN=null; return commit(); }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='wform'){ const d=document.getElementById('w-date').value, kg=parseFloat(String(document.getElementById('w-kg').value).replace(',','.')); if(!d||!(kg>0)) return; const i=state.weights.findIndex(w=>w.d===d); const rec={d,kg:Math.round(kg*10)/10}; if(i>-1) state.weights[i]=rec; else state.weights.push(rec); document.getElementById('w-kg').value=''; return commit(); }
  if(e.target.id==='eform'){ const d=document.getElementById('e-date').value; if(!d) return; if(!state.exams.find(x=>x.d===d)) state.exams.push({d,vals:{}}); selExam=d; return commit(); }
});
window.addEventListener('hashchange',onRoute);
onRoute();
initRuntime();
</script>

</body>
</html>
